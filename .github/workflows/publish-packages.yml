name: Publish NuGet Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.2.3 or 1.2.3-beta)"
        required: true
        type: string
  release:
    types: [published]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Unable to determine version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Snowball sources
        run: |
          cd ext/snowball
          make dist_libstemmer_csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Tests and sample run on .NET 9; libraries target .NET Standard 2.0.
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore LexiDiff.sln

      - name: Clean package output
        run: |
          if [ -d artifacts/packages ]; then
            rm -rf artifacts/packages
          fi

      - name: Pack
        run: dotnet pack LexiDiff.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Verify NuGet packages
        run: python3 .github/scripts/verify-packages.py

      - name: Authenticate to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: gaspardpetit

      - name: Push packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo 'NuGet login did not return a temporary API key.' >&2
            exit 1
          fi
          dotnet nuget push artifacts/packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
