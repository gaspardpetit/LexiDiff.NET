name: Build & Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Snowball sources
        run: |
          cd ext/snowball
          make dist_libstemmer_csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Tests and sample run on .NET 9; libraries target .NET Standard 2.0.
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore LexiDiff.sln

      - name: Build
        run: dotnet build LexiDiff.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LexiDiff.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Pack
        run: dotnet pack LexiDiff.sln --configuration Release --no-build --no-restore --output artifacts/package-validation

      - name: Verify NuGet packages
        run: python3 .github/scripts/verify-packages.py artifacts/package-validation
